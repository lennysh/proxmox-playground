# Copy this file and fill in API credentials if you are not running on a
# cluster node as root (pvesh). Do not commit secrets.

[api]
# Empty host => use `pvesh` on this node (cluster-wide; any node is fine).
# Remote example: 192.168.1.10 or pve1.example.com
host =
user = root@pam
# API token: Datacenter → Permissions → API Tokens
# Privilege: Sys.Audit + Sys.Modify on /, plus VM.Audit (or VM.Backup) on /vms
token_id =
token_secret =
# Alternative to a token (interactive / less ideal for cron):
# password =
verify_tls = false

[job]
# From `sync-backup-job-from-tags.py --list-jobs` (the job UUID / id).
id =
# all-except  = backup every guest that is not excluded (matches "All except …")
# include-mode = only guests whose resolved backup *mode* matches --mode / default_mode
selection = all-except
# Also write vzdump `mode` (snapshot|suspend|stop) onto the job
sync_mode = true
skip_templates = false

[tags]
# Opt-out: any of these tags skips the guest. Comma-separated.
exclude = no-backup
# Opt-in extra filter. Empty = all guests except exclude tags.
include =
case_insensitive = true

# Mode tags (job-wide in Proxmox — one mode per job). Empty tag lists are ok.
snapshot = backup-snapshot
suspend = backup-suspend
stop = backup-stop
default_mode = snapshot
# fail | use-default | prefer-first
conflict = fail
